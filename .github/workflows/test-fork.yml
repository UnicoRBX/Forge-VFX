name: test-fork

# the engine lane for pull requests from forks.
#
# github hands a fork pull request no secrets, so test.yml's roblox job skips
# those. workflow_run is the only trigger that runs in the base repository's
# context, which is what makes the api key reachable at all. that is also
# exactly why this is gated: it checks out the contributor's commit and runs it
# with real credentials, so the roblox-cloud environment holds a required
# reviewer and the job waits until a human has read the diff.
#
# never rewrite this to use pull_request_target. that runs the same untrusted
# code in a job that already holds the secrets, with no gate in front of it.
on:
  workflow_run:
    workflows: ["test"]
    types: [completed]

permissions:
  contents: read

jobs:
  roblox:
    # fork pull requests only. a same-repo pull request is already covered by
    # test.yml's own roblox job, and running both would double every push.
    # a failed lune run is not worth an approval or an open cloud task.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository

    runs-on: ubuntu-latest
    environment: roblox-cloud

    steps:
      - uses: actions/checkout@v4
        with:
          # the contributor's commit, not the base branch. deliberate, and the
          # reason the environment gate exists
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive

      - uses: CompeyDev/setup-rokit@v0.1.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: engine tests
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: python3 scripts/roblox_cloud_test.py
