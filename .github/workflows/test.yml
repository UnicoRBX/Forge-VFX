name: test

on:
  push:
  pull_request:

# selene is in rokit.toml and selene.toml is configured, but it is not a gate
# yet: with the generated Roblox std it reports 10 errors, and all of them are
# standard-library modelling gaps rather than defects (vector.create accepts 2
# arguments in real Luau, CFrame.identity is not modelled as a CFrame). Two
# if_same_then_else warnings in src/init.luau and src/mod/utility.luau predate
# this workflow and want a human decision before anything gates on them.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: CompeyDev/setup-rokit@v0.1.2

      - name: lune
        run: lune run tests/run

      - name: stylua
        run: stylua --check src tests scripts

  # the same specs the lune job cannot reach: EncodingService, Color3 rounding,
  # anything where lune only emulates the engine. skipped rather than failed on
  # a fork pull request, which github gives no secrets to; test-fork.yml picks
  # those up behind a review gate.
  roblox:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: CompeyDev/setup-rokit@v0.1.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build place
        run: ./scripts/build-test-place.sh

      # each run saves its own place version and targets it by number, so
      # concurrent runs cannot read each other's upload
      - name: engine tests
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: python3 scripts/roblox_cloud_test.py
